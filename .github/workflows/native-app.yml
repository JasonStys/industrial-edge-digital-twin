# File: native-app.yml
# Purpose: Build the genuine Windows HMI/C++ application and verify its actual native workflow.
name: Native application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows bundled simulator journey
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual native simulator and statically linked C++ kernel
        shell: pwsh
        run: ./scripts/build-native.ps1 -Output release/windows
      - name: Exercise actual packaged window, kernel and durable review
        run:
          node scripts/native-acceptance.mjs
          release/windows/win-unpacked/IndustrialEdgeDigitalTwin.exe artifacts/native/windows
      - name: Preserve short-lived package and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twin-native-windows
          retention-days: 1
          path: |
            release/windows/win-unpacked
            artifacts/native/windows
          if-no-files-found: error
